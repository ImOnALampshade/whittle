name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Never cancelled: a release stops only by failing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Check the tag against the manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/release_tag.py "$TAG"

  linux:
    name: Linux x64
    needs: tag
    uses: ./.github/workflows/test.yml
    with:
      runner: ubuntu-latest
      gate: true

  # For the record only: publish does not need this job, so these platforms can
  # neither hold a release back nor fail it.
  untested:
    name: Untested platform
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-latest]
    uses: ./.github/workflows/test.yml
    with:
      runner: ${{ matrix.runner }}
      gate: false

  # No checkout: the one job holding a write token runs nothing from the repo.
  publish:
    name: Publish the GitHub Release
    needs: [tag, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: whittle-zip
          path: dist

      - name: Write the checksum
        working-directory: dist
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          zip="whittle-$VERSION.zip"
          if [ ! -f "$zip" ]; then
              echo "::error::$zip was not built; found: $(ls)"
              exit 1
          fi
          sha256sum "$zip" > "$zip.sha256"
          sha256sum -c "$zip.sha256"

      - name: Create the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.tag.outputs.version }}
          PRERELEASE: ${{ needs.tag.outputs.prerelease }}
        run: |
          prerelease=""
          if [ "$PRERELEASE" = "true" ]; then
              prerelease="--prerelease"
          fi
          timeout 300 gh release create "$TAG" "whittle-$VERSION.zip" "whittle-$VERSION.zip.sha256" \
              --verify-tag --title "Whittle $TAG" --generate-notes $prerelease
