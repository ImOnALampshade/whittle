# Builds the documentation site and publishes main's to GitHub Pages. Nothing
# depends on this workflow: a failure leaves the site as it was and holds back
# neither CI nor a release. The repository's Pages source must be GitHub Actions:
# set it before this first reaches main, or start this by hand on main after.
name: Docs

on:
  push:
    # A ci/** push builds, to try a change here; only main deploys.
    branches: [main, 'ci/**']
    # All that the site is built from. The whole of whittle/: autodoc and viewcode
    # read the source, and conf.py reads the version and the links in the manifest.
    paths:
      - docs/site/**
      - '!docs/site/shots/**'
      - docs/images/**
      - whittle/**
      - docs.sh
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

# A run under way is never cancelled, so a deploy finishes. One run per ref at a
# time also keeps an older push from deploying over a newer one; of the runs
# waiting, only the newest stays and the rest show as cancelled. Re-running an old
# run rebuilds its own commit, so that does put the older site back.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Not the runner's own Python: the lock's Sphinx needs 3.13 or later.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'

      - name: Make the docs venv from the lock
        run: |
          timeout 120 python3 -m venv .venv-docs
          timeout 300 .venv-docs/bin/pip install --require-hashes --only-binary :all: --no-deps -r docs/site/requirements.lock

      - name: Build the site
        run: ./docs.sh --strict --out build/site

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site/html

  # No checkout: the one job that can change the site runs nothing from the repo.
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
